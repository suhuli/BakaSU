name: Check android12-5.10 SUSFS profile
on:
  push:
    branches: [susfs-android12-5.10]
  pull_request:
    paths:
      - kernel/**
      - tests/test_susfs_profile.py
      - .github/workflows/susfs-compat-check.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Check conditional exports, integration guards and manager pairing
        run: python3 -m unittest discover -s tests -v
